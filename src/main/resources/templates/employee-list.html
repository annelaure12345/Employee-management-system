<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Employee List</title>
    <link rel="stylesheet" type="text/css" th:href="@{/styles.css}">
</head>
<body>
<h1>Employee List</h1>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Image</th>
        <th>Salary</th>
        <th>Department</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="employee : ${employees}">
        <td th:text="${employee.id}"></td>
        <td th:text="${employee.firstname}"></td>
        <td th:text="${employee.lastname}"></td>
        <td th:text="${employee.email}"></td>
        <td>
            <img th:src="${employee.imageUrl}" alt="Employee Image" width="50" height="50"/>
        </td>
        <td th:text="${employee.salary}"></td>
        <td th:text="${employee.department != null ? employee.department.departmentName : 'N/A'}"></td>
        <td>
            <a th:href="@{'/departments/edit/' + ${employee.department != null ? employee.department.id : 0}}">Edit</a>
            |
            <a th:href="@{'/departments/delete/' + ${employee.department != null ? employee.department.id : 0}}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<a class="button" href="/add">Add New Employee</a>
</body>
</html>
