<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Employee Form</title>
    <Link rel="stylesheet" type="text/css" th:href="@{/styles.css}">
</head>
<body>
<h2>Employee Form</h2>
<form th:action="@{/save}" th:object="${employee}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <div>
        <label>First Name:</label>
        <input type="text" th:field="*{firstname}" required/>
    </div>
    <div>
        <label>Last Name:</label>
        <input type="text" th:field="*{lastname}" required/>
    </div>
    <div>
        <label>Email:</label>
        <input type="email" th:field="*{email}" required/>
    </div>
    <div>
        <label>Image URL:</label>
        <input type="text" th:field="*{imageUrl}" required/>
    </div>
    <div>
        <label>Salary:</label>
        <input type="number" th:field="*{salary}" required/>
    </div>
    <div>
        <label>Department:</label>
        <select th:field="*{department.id}">
            <option th:each="department:${departments}" th:value="${department.id}"th:text="${department.departmentName}"></option>
        </select>
        <a class="button" href="/departments/add" style="...">Create New Department</a>
    </div>
    <div>
        <button type="submit">Save</button>
    </div>
</form>
<a class="button "href="/">Back to Employee list</a>
</body>
</html>
